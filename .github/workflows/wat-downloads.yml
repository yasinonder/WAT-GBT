name: WAT Windows Downloads

on:
  push:
    branches:
      - codex/wat-gbt-ai-branding
    paths:
      - .github/workflows/wat-downloads.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful WAT Windows Build run
        required: true
        default: "39470484939"

permissions:
  contents: read
  actions: read

jobs:
  downloads:
    if: github.repository == 'yasinonder/WAT-GBT'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified Windows packages
        uses: actions/download-artifact@v7
        with:
          name: WAT-GBT-AI-Windows-x64
          run-id: ${{ inputs.run_id || '39470484939' }}
          github-token: ${{ github.token }}
          path: packages

      - name: Upload portable download
        uses: actions/upload-artifact@v7
        with:
          name: WAT-GBT-AI-Windows-x64-Portable
          path: |
            packages/*-x64-portable.exe
            packages/SHA256SUMS.txt
            packages/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer download
        uses: actions/upload-artifact@v7
        with:
          name: WAT-GBT-AI-Windows-x64-Setup
          path: |
            packages/*-x64-setup.exe
            packages/SHA256SUMS.txt
            packages/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
